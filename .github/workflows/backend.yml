name: Backend Tests

on:
  push:
    branches:
      - dev
      - master
    paths:
      - 'backend/**'
  pull_request:
    paths:
      - 'backend/**'
  workflow_dispatch:

jobs:
  test:
    name: Test Workers backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: './backend/pnpm-lock.yaml'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

  # NOTE: El despliegue automático (prod desde master, staging desde dev) se
  # habilita cuando DevOps/Staff configuren los entornos de Cloudflare.
  # deploy:
  #   name: Deploy to Cloudflare (pending DevOps config)
  #   ...